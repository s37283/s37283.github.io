<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>หน้าแนะนำตัวของฉัน</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #ffd6e7, #d9f3ff, #fff3b0);
        color: #5c4b51;
        text-align: center;
        padding: 50px 20px;
        font-family: "Arial", sans-serif;
    }

    /* การ์ดแนะนำตัว */
    .card {
        background: linear-gradient(145deg, #ffffff, #fff7fb);
        border-radius: 30px;
        box-shadow: 0 15px 35px rgba(214, 100, 150, 0.25);
        max-width: 550px;
        margin: 30px auto;
        padding: 40px 30px;
        border: 4px solid #ffffff;
        transition: 0.3s;
    }

    /* เอฟเฟกต์เมื่อเอาเมาส์วาง */
    .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 45px rgba(214, 100, 150, 0.35);
    }

    h1 {
        color: #e85d8f;
        font-size: 30px;
        margin-bottom: 25px;
    }

    p {
        font-size: 18px;
        line-height: 1.8;
        color: #6d5962;
    }

    strong {
        color: #d94f82;
    }

    /* ปุ่ม Portfolio */
    a {
        display: inline-block;
        margin-top: 10px;
        padding: 14px 28px;
        background: linear-gradient(135deg, #ff7eb3, #ff758c);
        color: white;
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;
        border-radius: 50px;
        box-shadow: 0 8px 18px rgba(255, 117, 140, 0.3);
        transition: 0.3s;
    }

    a:hover {
        transform: scale(1.08);
        background: linear-gradient(135deg, #ff5f9e, #ff4f70);
    }

    /* ตกแต่งข้อความ */
    .emoji {
        font-size: 45px;
        margin-bottom: 10px;
    }

</style>
</head>

<body>

<div class="card">

    <div class="emoji">🌸✨</div>

    <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน</h1>

    <p>
        สวัสดีค่ะ! ดิฉันชื่อ
        <strong>ชนภัทร ศิวิไล</strong><br>
        (Chanapat Siwilai)
    </p>

    <p>
        🎓 ขณะนี้กำลังศึกษา/สนใจด้าน<br>
        <strong>Gifted / Medical & Pharmaceutical</strong>
    </p>

    <p>
        💻 นี่คือเว็บไซต์แรกของดิฉัน<br>
        ที่โฮสต์บน <strong>GitHub Pages</strong>!
    </p>

</div>

<a href="portfolio.html">🌷 ดูแฟ้มสะสมผลงาน 🌷</a>

</body>
</html>
