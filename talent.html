<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ความสามารถพิเศษ</title>
  <!-- ดึงฟอนต์ Kanit จาก Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }

    body {
      background-color: #fce4ec; /* พื้นหลังสีชมพูพาสเทลตามภาพตัวอย่าง */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    /* === สไตล์ส่วนหัวข้อแบบใหม่ตามรูปภาพ === */
    .header-card {
      background-color: #ffffff; /* การ์ดสีขาว */
      border-radius: 20px; /* มุมโค้งมนสวยงาม */
      padding: 24px 28px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(233, 30, 99, 0.08); /* เงาฟุ้งนุ่มๆ */
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .heart-icon {
      font-size: 32px;
      line-height: 1;
      display: flex;
      align-items: center;
    }

    .title-text {
      color: #ff3377; /* สีชมพูสดใสตามแบบ */
      font-size: 28px;
      font-weight: 800; /* ตัวหนาพิเศษ */
      letter-spacing: 0.5px;
    }

    /* === ส่วนการ์ดแสดงกราฟ === */
    .chart-card {
      background-color: #ffffff;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 4px 15px rgba(233, 30, 99, 0.08);
    }

    .chart-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chart-row {
      display: flex;
      align-items: center;
    }

    .label {
      width: 140px;
      text-align: right;
      padding-right: 15px;
      font-size: 15px;
      font-weight: 600;
      color: #555555;
    }

    .bar-container {
      flex: 1;
      height: 36px;
      background-color: #f8bbd0; /* สีแท่งส่วนที่เหลือ */
      border-radius: 4px;
      display: flex;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background-color: #ff3377; /* สีแท่งคะแนนหลัก */
    }

    /* สเกลตัวเลขด้านล่าง 0 - 100 */
    .scale-container {
      display: flex;
      margin-left: 140px;
      margin-top: 6px;
      justify-content: space-between;
      color: #888888;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- หัวข้อแบบการ์ดสีขาว + ไอคอนหัวใจ (สไตล์ตามรูปภาพใหม่) -->
    <div class="header-card">
      <span class="heart-icon">💖</span>
      <h1 class="title-text">ความสามารถพิเศษ</h1>
    </div>

    <!-- ส่วนกราฟแสดงความสามารถ -->
    <div class="chart-card">
      <div class="chart-container">
        
        <!-- รายการที่ 1 -->
        <div class="chart-row">
          <div class="label">จิตอาสา</div>
          <div class="bar-container">
            <div class="bar-fill" style="width: 85%;"></div>
          </div>
        </div>

        <!-- รายการที่ 2 -->
        <div class="chart-row">
          <div class="label">แก้ไขปัญหาเฉพาะหน้า</div>
          <div class="bar-container">
            <div class="bar-fill" style="width: 70%;"></div>
          </div>
        </div>

        <!-- รายการที่ 3 -->
        <div class="chart-row">
          <div class="label">ทำงานร่วมกับผู้อื่น</div>
          <div class="bar-container">
            <div class="bar-fill" style="width: 84%;"></div>
          </div>
        </div>

        <!-- รายการที่ 4 -->
        <div class="chart-row">
          <div class="label">ความเป็นผู้นำ</div>
          <div class="bar-container">
            <div class="bar-fill" style="width: 83%;"></div>
          </div>
        </div>

        <!-- สเกลตัวเลข 0 - 100 -->
        <div class="scale-container">
          <span>0</span>
          <span>20</span>
          <span>40</span>
          <span>60</span>
          <span>80</span>
          <span>100</span>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
