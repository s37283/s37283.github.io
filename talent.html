<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ความสามารถพิเศษ | Portfolio</title>

  <!-- Google Fonts : Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    /* =========================
       ตั้งค่าพื้นฐาน
    ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }

    body {
      min-height: 100vh;

      background: linear-gradient(
        135deg,
        #ffd6e7,
        #d9f3ff,
        #fff3b0
      );

      padding-bottom: 30px;
    }


    /* =========================
       เมนูด้านบน
    ========================= */

    .navbar {
      width: 100%;

      background: rgba(255, 255, 255, 0.96);

      padding: 15px 10px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.12);

      position: sticky;
      top: 0;
      z-index: 1000;

      display: flex;
      justify-content: center;
      align-items: center;

      flex-wrap: wrap;
      gap: 8px;
    }

    .navbar a {
      text-decoration: none;

      color: #d94f82;

      background: #fff0f6;

      padding: 8px 14px;

      border-radius: 20px;

      font-size: 15px;
      font-weight: 500;

      transition: 0.3s;
    }

    .navbar a:hover {
      background: linear-gradient(
        135deg,
        #ff7eb3,
        #ff758c
      );

      color: white;

      transform: translateY(-2px);

      box-shadow:
        0 4px 10px rgba(255, 117, 140, 0.25);
    }


    /* =========================
       กล่องหลัก
    ========================= */

    .container {
      width: 100%;

      max-width: 800px;

      margin: 40px auto 0;

      padding: 0 20px;
    }


    /* =========================
       หัวข้อ
    ========================= */

    .header-card {
      background: rgba(255, 255, 255, 0.95);

      border-radius: 20px;

      padding: 24px 28px;

      margin-bottom: 25px;

      box-shadow:
        0 4px 15px rgba(233, 30, 99, 0.12);

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 12px;
    }

    .heart-icon {
      font-size: 32px;

      line-height: 1;
    }

    .title-text {
      color: #ff3377;

      font-size: 30px;

      font-weight: 800;

      letter-spacing: 0.5px;
    }


    /* =========================
       การ์ดกราฟ
    ========================= */

    .chart-card {
      background: rgba(255, 255, 255, 0.95);

      border-radius: 20px;

      padding: 35px 30px;

      box-shadow:
        0 4px 15px rgba(233, 30, 99, 0.12);
    }

    .chart-container {
      display: flex;

      flex-direction: column;

      gap: 18px;
    }


    /* =========================
       แต่ละแถว
    ========================= */

    .chart-row {
      display: flex;

      align-items: center;
    }


    /* ชื่อความสามารถ */

    .label {
      width: 170px;

      text-align: right;

      padding-right: 15px;

      font-size: 15px;

      font-weight: 600;

      color: #555555;

      flex-shrink: 0;
    }


    /* =========================
       พื้นหลังแท่งกราฟ
    ========================= */

    .bar-container {
      flex: 1;

      height: 36px;

      background-color: #f8bbd0;

      border-radius: 6px;

      display: flex;

      overflow: hidden;
    }


    /* แท่งคะแนน */

    .bar-fill {
      height: 100%;

      background: linear-gradient(
        90deg,
        #ff69a8,
        #ff3377
      );

      border-radius: 6px 0 0 6px;

      transition: width 0.8s ease;
    }


    /* =========================
       ตัวเลข 0 - 100
    ========================= */

    .scale-container {
      display: flex;

      margin-left: 170px;

      margin-top: 5px;

      justify-content: space-between;

      color: #888888;

      font-size: 13px;

      font-weight: 600;
    }


    /* =========================
       ปุ่มกลับ Portfolio
    ========================= */

    .back {
      text-align: center;

      margin: 45px 0 30px;
    }

    .back a {
      display: inline-block;

      background: #ff69a8;

      color: white;

      text-decoration: none;

      padding: 14px 45px;

      border-radius: 50px;

      font-size: 20px;

      font-weight: 500;

      box-shadow:
        0 5px 15px rgba(255, 105, 168, 0.25);

      transition: 0.3s;
    }

    .back a:hover {
      background: #ff4f98;

      transform: translateY(-3px);

      box-shadow:
        0 8px 20px rgba(255, 105, 168, 0.35);
    }


    /* =========================
       โทรศัพท์
    ========================= */

    @media (max-width: 700px) {

      .navbar {
        padding: 10px 5px;

        gap: 5px;
      }

      .navbar a {
        font-size: 13px;

        padding: 7px 10px;
      }

      .container {
        margin-top: 25px;

        padding: 0 12px;
      }

      .header-card {
        padding: 20px 15px;
      }

      .title-text {
        font-size: 24px;
      }

      .heart-icon {
        font-size: 28px;
      }

      .chart-card {
        padding: 25px 15px;
      }

      .label {
        width: 125px;

        font-size: 13px;

        padding-right: 10px;
      }

      .scale-container {
        margin-left: 125px;

        font-size: 12px;
      }

      .bar-container {
        height: 32px;
      }

      .back a {
        font-size: 18px;

        padding: 13px 35px;
      }
    }


    /* =========================
       โทรศัพท์จอเล็กมาก
    ========================= */

    @media (max-width: 420px) {

      .label {
        width: 105px;

        font-size: 12px;
      }

      .scale-container {
        margin-left: 105px;
      }

      .bar-container {
        height: 28px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       เมนูด้านบน
  ========================= -->

  <nav class="navbar">

    <a href="portfolio.html">
      🏠 หน้าแรก
    </a>

    <a href="intro.html">
      📖 คำนำ
    </a>

    <a href="profile.html">
      👤 ประวัติส่วนตัว
    </a>

    <a href="education.html">
      🎓 ประวัติการศึกษา
    </a>

    <a href="interest.html">
      🔬 ความสนใจในการศึกษาต่อ
    </a>

    <a href="activity.html">
      🏆 กิจกรรมที่เข้าร่วม
    </a>

    <a href="talent.html">
      ⭐ ความสามารถพิเศษ
    </a>

  </nav>



  <!-- =========================
       กล่องหลัก
  ========================= -->

  <div class="container">


    <!-- =========================
         หัวข้อ
    ========================= -->

    <div class="header-card">

      <span class="heart-icon">
        💖
      </span>

      <h1 class="title-text">
        ความสามารถพิเศษ
      </h1>

    </div>



    <!-- =========================
         การ์ดกราฟ
    ========================= -->

    <div class="chart-card">

      <div class="chart-container">


        <!-- ความสามารถที่ 1 -->

        <div class="chart-row">

          <div class="label">
            จิตอาสา
          </div>

          <div class="bar-container">

            <div
              class="bar-fill"
              style="width: 85%;">
            </div>

          </div>

        </div>



        <!-- ความสามารถที่ 2 -->

        <div class="chart-row">

          <div class="label">
            ทักษะการปฐมพยาบาลและการตรวจเบื้องต้น
          </div>

          <div class="bar-container">

            <div
              class="bar-fill"
              style="width: 70%;">
            </div>

          </div>

        </div>



        <!-- ความสามารถที่ 3 -->

        <div class="chart-row">

          <div class="label">
            ทำงานร่วมกับผู้อื่น
          </div>

          <div class="bar-container">

            <div
              class="bar-fill"
              style="width: 84%;">
            </div>

          </div>

        </div>



        <!-- ความสามารถที่ 4 -->

        <div class="chart-row">

          <div class="label">
            ความเป็นผู้นำ
          </div>

          <div class="bar-container">

            <div
              class="bar-fill"
              style="width: 83%;">
            </div>

          </div>

        </div>



        <!-- =========================
             ตัวเลข 0 - 100
        ========================= -->

        <div class="scale-container">

          <span>0</span>

          <span>20</span>

          <span>40</span>

          <span>60</span>

          <span>80</span>

          <span>100</span>

        </div>


      </div>

    </div>



    <!-- =========================
         ปุ่มกลับหน้า Portfolio
    ========================= -->

    <div class="back">

      <a href="portfolio.html">
        🌷 กลับหน้า Portfolio
      </a>

    </div>


  </div>


</body>
</html>
